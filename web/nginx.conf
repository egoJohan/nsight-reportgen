# Distinguish browser navigations (Accept: text/html — full-page loads, refresh,
# deep links to client-side routes like /cases/:id) from XHR/fetch API calls
# (Accept: */* or application/json). The SPA and the API share several
# prefixes, so this keeps deep-links working without a full-page 405 from the API.
map $http_accept $nsight_html_nav {
    default 0;
    "~*text/html" 1;
}

# In staging, Caddy (deploy/Caddyfile) terminates TLS and proxies to this
# container over plain HTTP on loopback (docker-compose.staging.yml) -- so
# nginx's own $scheme is always "http", and setting X-Forwarded-Proto from
# it unconditionally would tell the backend every request is plain HTTP even
# when the browser is on https. Caddy's reverse_proxy already sets
# X-Forwarded-Proto to what the browser actually used; prefer that, falling
# back to $scheme only when nothing forwarded a value (nginx hit directly,
# e.g. plain docker-compose.yml or a health check).
map $http_x_forwarded_proto $nsight_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SAV uploads can be a few MB; renders can take a while.
    client_max_body_size 50m;

    # API -> backend. /cases, /customers and /settings are ALSO client-side
    # SPA routes, so the Accept-header trick decides browser navigation
    # (serve the SPA) from fetch/XHR (proxy to the backend). /reports and
    # /auth are never SPA routes -- proxied unconditionally. An OIDC callback
    # in particular is a full-page navigation FROM the identity provider and
    # must reach the backend directly, never the SPA fallback.
    #
    # This is an enumerated list of the API's top-level prefixes, not a
    # catch-all `location /`. A catch-all would also forward /docs,
    # /openapi.json and /redoc onto the production origin, which today are
    # unreachable (the backend publishes no port of its own — only nginx
    # does). Add a prefix here when the API gains one, rather than widening
    # this into a blanket proxy.
    location /cases {
        if ($nsight_html_nav) { rewrite ^ /index.html last; }
        proxy_pass http://backend:8200;
    }
    location /customers {
        if ($nsight_html_nav) { rewrite ^ /index.html last; }
        proxy_pass http://backend:8200;
    }
    location /settings {
        if ($nsight_html_nav) { rewrite ^ /index.html last; }
        proxy_pass http://backend:8200;
    }
    location /materials   { proxy_pass http://backend:8200; }
    location /chart-types { proxy_pass http://backend:8200; }
    location /reports     { proxy_pass http://backend:8200; }
    location /auth        { proxy_pass http://backend:8200; }
    location /users       { proxy_pass http://backend:8200; }
    location /invites     { proxy_pass http://backend:8200; }
    location /access-requests { proxy_pass http://backend:8200; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $nsight_forwarded_proto;
    # $host already carries the browser's Host header (nginx falls back to
    # it when there's no Host in the request line), but routes_auth.py's
    # OAuth callback URL reads X-Forwarded-Host explicitly, standard-header
    # style, rather than assuming Host was left alone -- set it too so that
    # holds regardless of what sits in front of nginx.
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
