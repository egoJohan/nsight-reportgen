# Distinguish browser navigations (Accept: text/html — full-page loads, refresh,
# deep links to client-side routes like /cases/:id) from XHR/fetch API calls
# (Accept: */* or application/json). The SPA and the API share several
# prefixes, so this keeps deep-links working without a full-page 405 from the API.
map $http_accept $nsight_html_nav {
    default 0;
    "~*text/html" 1;
}

# In staging, Caddy (deploy/Caddyfile) terminates TLS and proxies to this
# container over plain HTTP on loopback (docker-compose.staging.yml) -- so
# nginx's own $scheme is always "http", and setting X-Forwarded-Proto from
# it unconditionally would tell the backend every request is plain HTTP even
# when the browser is on https. Caddy's reverse_proxy already sets
# X-Forwarded-Proto to what the browser actually used; prefer that, falling
# back to $scheme only when nothing forwarded a value (nginx hit directly,
# e.g. plain docker-compose.yml or a health check).
#
# ONLY the two values a proxy can legitimately have sent. This passed the
# client's header through verbatim, and the backend is told to trust it
# (NSIGHT_TRUST_FORWARDED_HEADERS=1) -- so public_origin, which builds the
# OAuth redirect_uri AND the links in notification emails, was caller-chosen.
# Any signed-in user could make nSight email every admin a genuine permission
# request whose "Decide it here" link pointed at their own domain. Anything
# else now falls back to $scheme, i.e. to what nginx itself saw.
map $http_x_forwarded_proto $nsight_forwarded_proto {
    default  $scheme;
    "https"  "https";
    "http"   "http";
}

# The HOST half cannot be settled here: $host IS the client's Host header
# (server_name _ accepts any), and nginx has nothing better to offer. The
# answer is NSIGHT_PUBLIC_URL in the backend, which outranks every forwarded
# value — see routes_auth.public_origin, and both compose files, which set it.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SAV uploads can be a few MB; renders can take a while.
    client_max_body_size 50m;

    # Re-resolve the backend's name per request, through Docker's embedded DNS.
    #
    # With a literal name in proxy_pass, nginx resolves it ONCE at startup and
    # keeps the address for ever. Restart or rebuild the backend — every deploy
    # does — and it comes back on a new container IP while nginx goes on
    # proxying to the old one: every request 502s until somebody restarts
    # nginx too, with nothing to say why. A variable in proxy_pass makes nginx
    # resolve at request time instead. `valid=10s` bounds how long a stale
    # answer can be reused; ipv6=off because compose networks are v4 here and
    # an AAAA lookup only adds a failure mode.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nsight_backend "http://backend:8200";

    # API -> backend. /cases, /customers and /settings are ALSO client-side
    # SPA routes, so the Accept-header trick decides browser navigation
    # (serve the SPA) from fetch/XHR (proxy to the backend). /reports and
    # /auth are never SPA routes -- proxied unconditionally. An OIDC callback
    # in particular is a full-page navigation FROM the identity provider and
    # must reach the backend directly, never the SPA fallback.
    #
    # This is an enumerated list of the API's top-level prefixes, not a
    # catch-all `location /`. A catch-all would also forward /docs,
    # /openapi.json and /redoc onto the production origin, which today are
    # unreachable (the backend publishes no port of its own — only nginx
    # does). Add a prefix here when the API gains one, rather than widening
    # this into a blanket proxy.
    location /cases {
        if ($nsight_html_nav) { rewrite ^ /index.html last; }
        proxy_pass $nsight_backend;
    }
    location /customers {
        if ($nsight_html_nav) { rewrite ^ /index.html last; }
        proxy_pass $nsight_backend;
    }
    location /settings {
        if ($nsight_html_nav) { rewrite ^ /index.html last; }
        proxy_pass $nsight_backend;
    }
    # Readiness, polled by the maintenance screen while it is showing.
    location /readyz      { proxy_pass $nsight_backend; }
    location /materials   { proxy_pass $nsight_backend; }
    location /chart-types { proxy_pass $nsight_backend; }
    location /reports     { proxy_pass $nsight_backend; }
    location /auth        { proxy_pass $nsight_backend; }
    location /users       { proxy_pass $nsight_backend; }
    location /invites     { proxy_pass $nsight_backend; }
    location /access-requests { proxy_pass $nsight_backend; }
    # Reached with a signup ticket and no account — see routes_signup_requests.py.
    location /signup          { proxy_pass $nsight_backend; }
    location /signup-requests { proxy_pass $nsight_backend; }
    location /admin {
        # A restore uploads a whole backup, which is dominated by the SAVs
        # inside it — the 50m ceiling above is sized for one upload, not for
        # every SAV in the hive at once. Unlimited here rather than a number
        # that quietly truncates the one operation whose whole point is
        # completeness; the route itself refuses an archive that declares
        # more than it should.
        client_max_body_size 0;
        proxy_pass $nsight_backend;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $nsight_forwarded_proto;
    # $host already carries the browser's Host header (nginx falls back to
    # it when there's no Host in the request line), but routes_auth.py's
    # OAuth callback URL reads X-Forwarded-Host explicitly, standard-header
    # style, rather than assuming Host was left alone -- set it too so that
    # holds regardless of what sits in front of nginx.
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
